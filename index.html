<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jean & Bianca</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: white;
  color: #111;
  overflow: hidden;
}

.abertura {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.seta {
  color: #4169e1;
  font-size: 65px;
  line-height: 1;
  margin-bottom: 45px;
  animation: subirDescer 1.5s infinite;
}

.envelope {
  width: 280px;
  height: 185px;
  position: relative;
  border: 3px solid #111;
  background: white;
  cursor: pointer;
  overflow: hidden;
}

.envelope::before {
  content: "";
  position: absolute;
  width: 3px;
  height: 330px;
  background: #111;
  left: 50%;
  top: -72px;
  transform: rotate(57deg);
}

.envelope::after {
  content: "";
  position: absolute;
  width: 3px;
  height: 330px;
  background: #111;
  right: 50%;
  top: -72px;
  transform: rotate(-57deg);
}

.texto {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  z-index: 5;
}

.carta {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  opacity: 0;
  pointer-events: none;
  transform: scale(.95);
  transition: .6s;
}

.carta.aberta {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

.conteudo {
  max-width: 500px;
}

.conteudo h1 {
  font-family: Georgia, serif;
  font-size: 40px;
  margin-bottom: 15px;
}

.data {
  font-size: 18px;
  margin-bottom: 30px;
}

.mensagem {
  font-family: Georgia, serif;
  font-size: 20px;
  line-height: 1.7;
  margin-bottom: 35px;
}

.botao {
  display: inline-block;
  background: #4169e1;
  color: white;
  text-decoration: none;
  padding: 14px 25px;
  border-radius: 4px;
  font-size: 16px;
}

@keyframes subirDescer {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(8px);
  }
}
</style>
</head>

<body>

<div class="abertura" id="abertura">

  <div class="seta">↓</div>

  <div class="envelope" onclick="abrirCarta()">
    <div class="texto">
      Press to open
    </div>
  </div>

</div>

<div class="carta" id="carta">

  <div class="conteudo">

    <h1>Jean & Bianca</h1>

    <div class="data">
      14/11/2026
    </div>

    <div class="mensagem">
      Onde quer que você esteja,<br>
      é onde eu quero estar.
    </div>

    <a
      class="botao"
      href="https://jeanjogo040-coder.github.io/casamento-jean-bianca/"
    >
      Abrir nosso site 💙
    </a>

  </div>

</div>

<script>
function abrirCarta() {

  document.getElementById("carta").classList.add("aberta");

}
</script>

</body>
</html>y
